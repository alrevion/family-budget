version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cloudflare-tooling:
        patterns:
          - wrangler
          - "@cloudflare/*"
      test-tooling:
        patterns:
          - vitest
          - "@vitest/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
